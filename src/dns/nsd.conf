# ==============================================================================
# Kavach PS-022: NSD Authoritative DNS Server Configuration
#
# Constraints & Experimental Fairness:
#   - Bound strictly to target test IP 10.99.0.2:53 (no host port conflict).
#   - Single server process (server-count: 1) pinned to 1 CPU core.
#   - Response Rate Limiting (RRL) is EXPLICITLY DISABLED (rrl-ratelimit: 0)
#     so that drops occur exclusively at XDP or netfilter baselines.
#   - IPv6 disabled (do-ip6: no).
# ==============================================================================

server:
    ip-address: 10.99.0.2
    port: 53
    do-ip4: yes
    do-ip6: no

    # Single server worker process for deterministic single-core benchmarking
    server-count: 1

    # CRITICAL: Response Rate Limiting MUST BE DISABLED
    rrl-ratelimit: 0
    rrl-slip: 0

    # Paths and runtime permissions
    username: ""
    zonesdir: "/tmp/kavach_nsd/zones"
    database: ""
    logfile: "/tmp/kavach_nsd/nsd.log"
    pidfile: "/tmp/kavach_nsd/nsd.pid"
    xfrdfile: "/tmp/kavach_nsd/nsd.xfrd"
    verbosity: 1
    hide-version: yes

zone:
    name: "lab.test"
    zonefile: "lab.test.zone"

